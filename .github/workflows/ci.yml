name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (both raster backends)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Tests with rasterio (GDAL)
        run: python -m pytest -q -p no:warnings
      - name: Tests with the built-in GeoTIFF codec
        run: python -m pytest -q -p no:warnings
        env:
          SATQUERY_RASTER_BACKEND: builtin

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: The workspace and the API answer through nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['backend']['raster_backend'] == 'rasterio', d; print(d['backend'])"
          curl -fsS http://localhost:8080/api/capabilities | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['executable'], d; print(len(d['executable']), 'capabilities')"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # A client-side route is served the app, not a 404.
          curl -fsS http://localhost:8080/results/anything | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  single-image:
    name: Single-container image (Hugging Face Space) builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t satquery .
      - name: rasterio (GDAL) is usable in the image
        # Fetching imagery reads remote COGs through rasterio; the builtin
        # codec cannot, so a silent fallback would break every place question.
        run: docker run --rm satquery python -c "import rasterio, rasterio.vrt; print('rasterio', rasterio.__version__, 'GDAL', rasterio.__gdal_version__)"
      - name: Start
        run: docker run -d --name satquery -p 7860:7860 satquery
      - name: The workspace and the API answer on one port
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:7860/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:7860/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['backend']['raster_backend'] == 'rasterio', d; print(d['backend'])"
          curl -fsS http://localhost:7860/ | grep -q '<div id="root">'
          # Pages that share a path with an API alias still load the app.
          curl -fsS -H 'Accept: text/html' http://localhost:7860/results/anything | grep -q '<div id="root">'
          curl -fsS -H 'Accept: text/html' http://localhost:7860/capabilities | grep -q '<div id="root">'
          curl -fsS http://localhost:7860/capabilities | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['executable'], d; print(len(d['executable']), 'capabilities')"
      - name: Logs on failure
        if: failure()
        run: docker logs satquery

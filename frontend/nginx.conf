server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Satellite scenes are large; the backend enforces its own limit.
    client_max_body_size 600m;

    # The analysis service. A fetch-and-analyse request can take a minute or
    # more, so the read timeout is generous.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/results/..., /history, /login) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
